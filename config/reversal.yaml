# D2: large-cap one-day reversal (pre-registered in RESEARCH.md, batch D).
# Data: the stocks-in-play cache plus its 3:50 pm snapshot stage (config/orb.yaml, download.snap).
strategy: reversal
symbol: US large caps (top 500)

data:
  start: "2016-01-01"
  end: null
  cache_dir: data

periods:
  tune: ["2016-01-01", "2021-12-31"]
  validate: ["2022-01-01", "2023-12-31"]
  holdout: ["2024-01-01", null]

params:
  large_cap_rank: 500      # by 14-day average dollar volume, prior days only
  min_price: 5.0
  n_picks: 10              # biggest losers from the prior close to 3:50 pm
  exit: next_open          # next_open (D2a) | next_close (D2b)

sizing:
  max_leverage: 1.0

costs:
  commission_per_share: 0.0035
  slippage_per_share: 0.01       # each side; market-on-close / market-on-open fills

account:
  starting_equity: 25000

benchmark:
  flat_band: 0.003
