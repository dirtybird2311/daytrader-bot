# Batch I: the SPY swing rules (batch G/H) on individual large caps. Pre-registered in RESEARCH.md.
# Data: the stocks-in-play cache plus its 3:50 pm snapshot stage (config/orb.yaml, download.snap).
strategy: stock_rules
symbol: US large caps (top 500)

data:
  start: "2016-01-01"
  end: null
  cache_dir: data

periods:
  tune: ["2016-01-01", "2021-12-31"]
  validate: ["2022-01-01", "2023-12-31"]
  holdout: ["2024-01-01", null]

params:
  large_cap_rank: 500      # by 14-day average dollar volume, prior days only; ETFs/ETNs excluded
  min_price: 5.0
  exclude_funds: true
  rules: [down3_overnight, five_day_low, rsi2_high]   # down3_overnight, five_day_low, rsi2_high, turnaround_tue
  rsi_entry: 10
  sma_trend: 200           # only buy stocks above their 200-day average (0 = off)
  max_positions: 10        # equal slices; new entries ranked by RSI(2), most oversold first

sizing:
  max_leverage: 1.0

costs:
  commission_per_share: 0.0035
  slippage_per_share: 0.01       # each side; market-on-close / market-on-open fills

account:
  starting_equity: 25000

benchmark:
  flat_band: 0.003
